<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- App icon: friendly multiplication-table board -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- rounded board/slate -->
  <rect x="96" y="120" width="320" height="272" rx="36" fill="#ffffff" opacity="0.95" />

  <!-- multiplication sign -->
  <g stroke="#0369a1" stroke-width="34" stroke-linecap="round">
    <line x1="180" y1="196" x2="248" y2="264" />
    <line x1="248" y1="196" x2="180" y2="264" />
  </g>

  <!-- equals sign -->
  <g stroke="#0369a1" stroke-width="30" stroke-linecap="round">
    <line x1="300" y1="210" x2="380" y2="210" />
    <line x1="300" y1="250" x2="380" y2="250" />
  </g>

  <!-- playful number row -->
  <text
    x="256"
    y="356"
    text-anchor="middle"
    font-family="Fredoka, Arial, sans-serif"
    font-weight="700"
    font-size="72"
    fill="#0284c7"
  >123</text>

  <!-- MP brand badge (mandatory: fixed brand indigo, bottom-right corner) -->
  <circle cx="392" cy="392" r="88" fill="#4f46e5" stroke="#ffffff" stroke-width="10" />
  <text
    x="392"
    y="410"
    text-anchor="middle"
    font-family="Fredoka, Arial, sans-serif"
    font-weight="700"
    font-size="64"
    fill="#ffffff"
  >MP</text>
</svg>
